# Configuración del sitio de documentación (MkDocs)
# Construye:  make docs   →  site/
# Se publica en GitHub Pages bajo subpath: https://cacelass.github.io/climasafe/documentacion/
#
# Estética: la MISMA que el resto de cacelass.github.io (fondo oscuro, fuentes
# Sora + JetBrains Mono, acento azul). El footer "Made with Material for MkDocs"
# se elimina en overrides/main.html y se sustituye por el footer del sitio.
# El contenido es MÍNIMO a propósito: solo las secciones curadas.

site_name: ClimaSafe
site_url: https://cacelass.github.io/climasafe/documentacion/
docs_dir: documentacion
use_directory_urls: true

# Solo se construyen las páginas curadas; el resto de documentacion/ (notas
# internas, decisiones, actas, papers sueltos) queda excluido del sitio.
exclude_docs: |
  *
  **/*
  !index.md
  !modelos-pesos.md
  !riesgo-personalizacion.md
  !arquitectura.md
  !papers.md
  !llm.md
  !assets/extra.css

theme:
  name: material
  language: es
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: custom
      accent: custom
  font:
    text: Sora
    code: JetBrains Mono
  icon:
    logo: material/thermometer
    repo: fontawesome/brands/github

repo_url: https://github.com/ANFAIA/ClimaSafe
repo_name: ClimaSafe

extra_css:
  - assets/extra.css

nav:
  - Inicio: index.md
  - Modelos y pesos: modelos-pesos.md
  - Riesgo y personalización: riesgo-personalizacion.md
  - Arquitectura: arquitectura.md
  - Papers y fuentes: papers.md
  - LLM: llm.md
