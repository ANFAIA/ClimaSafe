# Configuración del sitio de documentación (MkDocs Material)
# Construye:  make docs   →  site/
# Se publica en GitHub Pages bajo subpath: https://cacelass.github.io/climasafe/documentacion/
#
# El sitio es MÍNIMO a propósito (2026-08-14): solo 4 páginas — Inicio,
# Modelos y pesos, Arquitectura y Papers —, escritas para quien visita la web.
# El resto de documentacion/ (notas internas, decisiones, actas) NO se publica:
# se excluye con exclude_docs y solo vive como fuente en el repo.

site_name: ClimaSafe
site_url: https://cacelass.github.io/climasafe/documentacion/
docs_dir: documentacion
use_directory_urls: true

# Solo se construyen las 4 páginas curadas; todo lo demás de documentacion/
# queda excluido del sitio (aunque siga en el repo como fuente).
exclude_docs: |
  *
  **/*
  !index.md
  !modelos-pesos.md
  !arquitectura.md
  !papers.md

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Modelos y pesos: modelos-pesos.md
  - Arquitectura: arquitectura.md
  - Papers: papers.md
