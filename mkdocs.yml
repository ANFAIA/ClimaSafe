# Configuración del sitio de documentación (MkDocs)
# Construye:  make docs   →  site/
# Se publica en GitHub Pages bajo subpath: https://cacelass.github.io/projects/climasafe/
#
# El contenido curado vive en docs_site/ (solo las 6 páginas del sitio); el
# resto de documentacion/ (notas internas, decisiones, actas) NO se publica.
# Estética: la MISMA que el resto de cacelass.github.io (fondo oscuro, fuentes
# Sora + JetBrains Mono, acento azul). El footer "Made with Material for MkDocs"
# se elimina en overrides/main.html y se sustituye por el footer del sitio.

site_name: ClimaSafe
site_url: https://cacelass.github.io/projects/climasafe/
docs_dir: docs_site
use_directory_urls: true

theme:
  name: material
  language: es
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: custom
      accent: custom
  font:
    text: Sora
    code: JetBrains Mono
  icon:
    logo: material/thermometer
    repo: fontawesome/brands/github

repo_url: https://github.com/ANFAIA/ClimaSafe
repo_name: ClimaSafe

extra_css:
  - assets/extra.css

nav:
  - Inicio: index.md
  - Guía de usuario: guia-usuario.md
  - Modelos y pesos: modelos-pesos.md
  - Riesgo y personalización: riesgo-personalizacion.md
  - Arquitectura: arquitectura.md
  - Papers y fuentes: papers.md
  - LLM: llm.md
