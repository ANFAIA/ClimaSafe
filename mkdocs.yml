# Configuración del sitio de documentación (MkDocs Material)
# Construye:  make docs   →  site/
# Se publica en GitHub Pages bajo subpath: https://cacelass.github.io/climasafe/documentacion/

site_name: ClimaSafe
site_url: https://cacelass.github.io/climasafe/documentacion/
docs_dir: documentacion
use_directory_urls: true

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

